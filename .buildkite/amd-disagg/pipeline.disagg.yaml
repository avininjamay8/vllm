# =============================================================================
# Disaggregated P/D (MoRIIO) SLURM gate — step snippet.
# -----------------------------------------------------------------------------
# The Buildkite agent must run on the SLURM login node and
# carry the `agent_pool` tag used here.
#
# Start gated `optional: true`; promote to required after several green runs.
# =============================================================================
steps:
  - label: "ROCm Disagg P/D 1P1D TP8 (MoRIIO) — SLURM"
    key: rocm-disagg-pd-1p1d-tp8-slurm
    agent_pool: amd_mi250_8 
    timeout_in_minutes: 120
    no_plugin: true                   # sbatch manages containers; skip docker plugin
    optional: true                    # does not block PRs while the queue stabilizes
    depends_on:
      - image-build-amd
    source_file_dependencies:
      - vllm/distributed/kv_transfer/
      - vllm/platforms/rocm.py
      - .buildkite/amd-disagg/
    env:
      NODES: "2"
      GPUS_PER_NODE: "8"
      WIDE_EP_MODE: "0"
      RUN_AFTER_HEALTH: "accuracy"
      SLURM_PARTITION: "amd-rccl"
      SLURM_TIME_LIMIT: "08:30:00"
    commands:
      - bash .buildkite/amd-disagg/run-slurm-disagg-test.sh

  - label: "ROCm Disagg P/D 1P1D TP8 MiniMax-M3-MXFP8 (MoRIIO) — SLURM"
    key: rocm-disagg-pd-1p1d-tp8-minimax-m3-slurm
    agent_pool: amd_mi250_8
    timeout_in_minutes: 180
    no_plugin: true                   # sbatch manages containers; skip docker plugin
    optional: true                    # does not block PRs while the queue stabilizes
    depends_on:
      - image-build-amd
    source_file_dependencies:
      - vllm/distributed/kv_transfer/
      - vllm/platforms/rocm.py
      - .buildkite/amd-disagg/
    env:
      NODES: "2"
      GPUS_PER_NODE: "8"
      WIDE_EP_MODE: "0"
      RUN_AFTER_HEALTH: "accuracy"
      SLURM_PARTITION: "amd-rccl"
      SLURM_TIME_LIMIT: "08:30:00"
      MODEL_NAME: "MiniMax-M3-MXFP8"
      # Serve from node-local NVMe; run_xPyD_disagg.slurm stages it there first.
      MODEL_DIR: "/mnt/m2m_nobackup/avpaul/models"
      MODEL_STAGE_SRC: "/shared_inference/avpaul/models/MiniMax-M3-MXFP8"
      MODEL_STAGE_LOCAL: "/mnt/m2m_nobackup/avpaul/models/MiniMax-M3-MXFP8"
      IMAGE: "vllm/vllm-openai-rocm:v0.24.0"
    commands:
      - bash .buildkite/amd-disagg/run-slurm-disagg-test.sh

  - label: "ROCm Disagg P/D 1P1D EP8/DP8 WideEP (MoRIIO) — SLURM"
    key: rocm-disagg-pd-1p1d-ep8-slurm
    agent_pool: amd_mi250_8 
    timeout_in_minutes: 120
    no_plugin: true                   # sbatch manages containers; skip docker plugin
    optional: true                    # does not block PRs while the queue stabilizes
    depends_on:
      - image-build-amd
    source_file_dependencies:
      - vllm/distributed/kv_transfer/
      - vllm/platforms/rocm.py
      - .buildkite/amd-disagg/
    env:
      NODES: "2"
      GPUS_PER_NODE: "8"
      WIDE_EP_MODE: "1"
      RUN_AFTER_HEALTH: "accuracy"
      SLURM_PARTITION: "amd-rccl"
      SLURM_TIME_LIMIT: "08:30:00"
    commands:
      - bash .buildkite/amd-disagg/run-slurm-disagg-test.sh
